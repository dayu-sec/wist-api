[package]
name = "wist-api"
version = "0.13.2" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "Cross-process agent-seam messages for the wist control plane (gateway <-> agentd)."
repository = "https://github.com/dayu-sec/wist-api"
homepage = "https://github.com/dayu-sec/wist-api"
documentation = "https://docs.rs/wist-api"
readme = "README.md"
keywords = ["wist", "api", "seam", "contract", "control"]
categories = ["data-structures", "network-programming"]

# seam 报文引用的**领域类型**（HostProfile / CredentialBundle / AgentIdentity …）仍在
# `wist-contracts`（两侧共同底座）；本 crate 只拥有「跨进程报文」这一层，故依赖 contracts。
[dependencies]
serde = { version = "1", features = ["derive"] }
wist-contracts = { version = "0.14" }
# 本地联调：切 path（整条链一起切，见 rust-gx/local-dev-and-publishing）
#wist-contracts = { version = "0.12", path = "../wist-contracts" }

[dev-dependencies]
serde_json = "1.0"

[lib]
path = "src/lib.rs"

[patch.crates-io]
# 2026-11-22：contracts 0.14.0 / api 0.13.2 已上 crates.io，patch 保持注释；
# 留着会让 CI 报 `patch location ... does not contain packages`（siblings 在 CI 上不存在）。
# E0（`ActionPlanStep.args`）：contracts 0.13 尚未发布，本地联调走 path。
# 发布完成后注释回去。
# wist-contracts = { path = "../wist-contracts" }
